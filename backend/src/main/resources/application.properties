spring.application.name=insurance-core-service
server.port=8081

#DB config
spring.datasource.url=jdbc:mysql://localhost:3306/IMS?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${IMS_DB_USERNAME:root}
spring.datasource.password=${IMS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU3ByaW5nQm9vdDM=}
app.internal.service-token=${IMS_INTERNAL_SERVICE_TOKEN:dev-change-me-in-env}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083/api/notifications}
document.service.url=${DOCUMENT_SERVICE_URL:http://localhost:8084/api/documents}
