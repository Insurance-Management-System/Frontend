server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Internal service-to-service endpoints must never be reachable from the internet, even
    # though they're also protected by a token check in the app itself - defense in depth.
    # This has to come before the general /api/ rule below (nginx matches longest prefix first).
    location /api/internal/ {
        deny all;
        return 403;
    }
    location /api/frontend/internal/ {
        deny all;
        return 403;
    }

    # Documents up to 10MB are accepted by document-service; nginx's 1MB default would
    # reject those uploads with 413 before they ever reach the backend.
    client_max_body_size 15m;

    # Proxy each backend under its own path, so the browser only ever talks to ONE origin
    # (this container) instead of 4 different ports. nginx matches the LONGEST prefix first
    # (exact "=" matches win over all prefixes), so these specific rules win over the
    # catch-all /api/ rule below for their own paths.
    #
    # NOTE: these use static hostnames (not variables) deliberately. A variable in proxy_pass
    # disables nginx's automatic "replace the matched location prefix with the proxy_pass URI"
    # rewriting for prefix locations - the full original request path gets forwarded unchanged
    # instead, which silently breaks routing (e.g. login started 403ing because it no longer
    # matched Spring Security's permitAll list). Static hostnames avoid that; the tradeoff is
    # nginx resolves each hostname once at startup, so if you recreate a backend container
    # individually (not via a full `docker compose up`), restart this frontend container too.
    location /api/auth/ {
        proxy_pass http://auth-service:9092/api/auth/;
        proxy_set_header Host $host;
    }
    location /api/payments/ {
        proxy_pass http://payment-service:8082/api/payments/;
        proxy_set_header Host $host;
    }

    # These two document endpoints are owned by ims-backend (DocumentAggregationController),
    # NOT document-service - they aggregate documents across customers and record admin
    # verify/reject decisions. Everything else under /api/documents/ is the real per-document
    # CRUD API, which does live on document-service. Without these exact-match overrides, the
    # general /api/documents/ rule below would send these two calls to document-service
    # instead, where they'd be misinterpreted as a request for a document with id
    # "by-customer" (or "notify-decision") and fail.
    location = /api/documents/by-customer {
        proxy_pass http://ims-backend:8081/api/documents/by-customer;
        proxy_set_header Host $host;
    }
    location = /api/documents/notify-decision {
        proxy_pass http://ims-backend:8081/api/documents/notify-decision;
        proxy_set_header Host $host;
    }
    # The upload endpoint is POST /api/documents - no trailing slash, no extra path segments -
    # so it does NOT match the /api/documents/ prefix rule below (nginx prefix locations require
    # the request URI to literally start with the full location string, trailing slash included).
    # Without this exact match, uploads would fall through to the generic /api/ rule (ims-backend),
    # which has no matching route there, and Spring's static-resource fallback would 301-redirect
    # it into a loop instead of ever reaching document-service.
    location = /api/documents {
        proxy_pass http://document-service:8084/api/documents;
        proxy_set_header Host $host;
    }
    location /api/documents/ {
        proxy_pass http://document-service:8084/api/documents/;
        proxy_set_header Host $host;
        # The AI analysis call (POST .../analyze) can legitimately take 90-150s on the free
        # OpenRouter tier - document-service itself waits up to 150s for it. nginx's 60s default
        # read timeout would kill the connection first and the browser would see a bare 504,
        # even though the analysis was still running successfully in the background.
        proxy_read_timeout 170s;
        proxy_send_timeout 170s;
    }
    # Everything else under /api/ goes to the IMS backend (customers, policies, claims, etc.)
    location /api/ {
        proxy_pass http://ims-backend:8081/api/;
        proxy_set_header Host $host;
    }

    # React Router uses client-side routes (e.g. /admin/documents) that don't exist as real
    # files - always fall back to index.html and let the app's router handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
